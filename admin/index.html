<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#061a52">
  <title>Admin · Convention Hymns</title>
  <link rel="icon" href="../icon-192.png?v=7" type="image/png" sizes="192x192">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Oriya:wght@400;600;800&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=1">
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="a-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="a-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="a-page" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="a-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
    <symbol id="a-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
    <symbol id="a-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="a-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
    <symbol id="a-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
    <symbol id="a-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="a-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="a-ext" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></symbol>
  </svg>

  <!-- Sign in -->
  <main class="login" id="login" hidden>
    <form class="login__card" id="loginForm" autocomplete="on">
      <span class="login__emblem" aria-hidden="true"><img src="../logo.webp" alt="" width="1024" height="1024"></span>
      <p class="login__brand">Convention Hymns</p>
      <h1 class="login__title">Admin sign in</h1>
      <label class="field">
        <span>Username</span>
        <input class="input" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      </label>
      <label class="field">
        <span>Password</span>
        <span class="pw">
          <input class="input" name="password" type="password" autocomplete="current-password" required>
          <button class="pw__toggle" type="button" data-act="pw-toggle" aria-label="Show password"><svg class="ic"><use href="#a-eye"/></svg></button>
        </span>
      </label>
      <p class="form-error" id="loginError" role="alert" hidden></p>
      <button class="btn btn--primary btn--block" type="submit" id="loginBtn">
        <svg class="ic"><use href="#a-lock"/></svg>Sign in
      </button>
      <a class="login__back" href="../">← Back to the app</a>
    </form>
  </main>

  <!-- Panel -->
  <div class="app" id="app" hidden>
    <header class="top">
      <a class="top__brand" href="../" title="Open the app">
        <span class="top__emblem" aria-hidden="true"><img src="../logo.webp" alt="" width="1024" height="1024"></span>
        <span class="top__name">Convention Hymns<small>Admin</small></span>
      </a>
      <span class="top__user" id="userChip"></span>
      <a class="btn btn--ghost btn--sm top__view" href="../" target="_blank" rel="noopener"><svg class="ic"><use href="#a-ext"/></svg><span>View app</span></a>
      <button class="btn btn--ghost btn--sm" type="button" data-act="logout"><svg class="ic"><use href="#a-out"/></svg><span>Log out</span></button>
    </header>

    <nav class="nav" id="nav" aria-label="Admin sections"></nav>

    <div class="changes" id="changes" hidden>
      <span class="changes__dot" aria-hidden="true"></span>
      <span class="changes__text">You have unpublished changes</span>
      <a class="btn btn--sm btn--light" href="../?preview=1" target="_blank" rel="noopener">Preview</a>
      <button class="btn btn--sm btn--light" type="button" data-act="discard">Discard</button>
      <button class="btn btn--sm btn--gold" type="button" data-act="tab" data-tab="publish">Publish</button>
    </div>

    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-act="modal-close"></div>
    <div class="modal__panel" role="dialog" aria-modal="true" id="modalPanel" tabindex="-1"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px">The admin panel needs JavaScript.</p></noscript>
  <script src="admin.js?v=1"></script>
</body>
</html>
